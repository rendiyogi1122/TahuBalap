[deploy]
startCommand = "php artisan migrate --force && php artisan storage:link && php artisan view:cache && frankenphp run --config /Caddyfile"

[build]
buildCommand = "composer install --optimize-autoloader --no-scripts --no-interaction && npm ci && npm run build && mkdir -p storage/framework/{sessions,views,cache,testing} storage/logs bootstrap/cache && chmod -R a+rw storage && php artisan config:cache && php artisan event:cache && php artisan route:cache"